name: CI Build & Automated Smoke Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Run Automated Smoke & Security Rules Tests
        run: npm test

      - name: Build Production Client
        run: npm run build

      - name: Verify Dist Chunks Integrity
        run: |
          ls -la dist/
          test -f dist/index.html || exit 1
