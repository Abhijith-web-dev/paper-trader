version: '3.8'

services:
  market-worker:
    build:
      context: .
      target: market-worker
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MARKET_WORKER_PORT=4001
      - YAHOO_FINANCE_ENABLED=true
      - FRANKFURTER_ENABLED=true
    networks:
      - globaltrade-net

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - MARKET_WORKER_URL=http://market-worker:4001
    depends_on:
      - market-worker
    networks:
      - globaltrade-net

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - globaltrade-net

networks:
  globaltrade-net:
    driver: bridge
