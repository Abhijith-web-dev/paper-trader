<!DOCTYPE html>
<html lang="en">
<head>

  <title>Sponsored Financial Dispatch</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="adsterra-slot"></div>
  <script type="text/javascript">
    (function() {
      var urlParams = new URLSearchParams(window.location.search);
      var key = urlParams.get('key') || '265129238f893cd98f180d1efd562793';
      var width = parseInt(urlParams.get('width') || '468', 10);
      var height = parseInt(urlParams.get('height') || '60', 10);
      var scriptUrl = urlParams.get('script') || ('https://bauval.org/22/' + encodeURIComponent(key));

      // Standard iframe options configuration
      window.atOptions = {
        'key' : key,
        'format' : 'iframe',
        'height' : height,
        'width' : width,
        'params' : {}
      };

      // Asynchronous container options configuration
      window.atAsyncOptions = {
        'key' : key,
        'format' : 'js',
        'async' : true,
        'container' : 'adsterra-slot',
        'params' : {}
      };

      // Synchronous document.write during initial HTML page parsing
      document.write('<script type="text/javascript" src="' + scriptUrl + '"><\/script>');
    })();
  </script>
</body>
</html>
