<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper Trading • Sponsored Partner Dispatch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F6F4EE;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .dispatch-card {
      background: #FAF8F3;
      border: 2px solid #111111;
      box-shadow: 6px 6px 0px #111111;
      max-width: 680px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    .gazette-header {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 900;
      font-size: 1.75rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      border-bottom: 2px solid #111111;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #111111;
      color: #F6F4EE;
      padding: 0.25rem 0.6rem;
      margin-bottom: 1rem;
    }
    .lead-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #333333;
      margin-bottom: 1.5rem;
    }
    .ad-container {
      background: #FFFFFF;
      border: 1px dashed #111111;
      padding: 1rem;
      margin: 1.5rem 0;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .return-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #111111;
      color: #FFFFFF;
      text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border: 2px solid #111111;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .return-btn:hover {
      background: #333333;
    }
    .disclaimer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.7rem;
      color: #777777;
      margin-top: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="dispatch-card">
    <div class="badge">Sponsored Financial Partner Dispatch</div>
    <h1 class="gazette-header">Paper Trading Terminal</h1>
    
    <p class="lead-text">
      You are accessing a sponsored advanced trading feature: 
      <strong id="feature-name">Strategy Backtest</strong>. 
      Zero personal portfolio or trading data is ever shared with advertising partners.
    </p>

    <!-- Sandboxed Ad Slot -->
    <div class="ad-container" id="adsterra-placement-slot">
      <script type="text/javascript">
        atOptions = {
          'key' : '265129238f893cd98f180d1efd562793',
          'format' : 'iframe',
          'height' : 60,
          'width' : 468,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://bauval.org/22/265129238f893cd98f180d1efd562793"></script>
    </div>

    <!-- Isolated Click-to-Open Script -->
    <script data-cfasync="false" src="https://abscloud.org/1/d558b6a9096b6007a50019663f7969c3"></script>

    <div>
      <button type="button" class="return-btn" onclick="window.close();">
        ← Return to Trading Workspace
      </button>
    </div>

    <div class="disclaimer">
      Official Adsterra Publisher Placement #6161748 • Strict 18+ Non-Adult Enforced
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var feature = params.get('feature') || 'backtest';
      var names = {
        'backtest': 'Quantitative Strategy Backtester',
        'vault': 'Encrypted Local Data Vault',
        'risk-calculator': 'Position Sizer & Risk Calculator',
        'transactions': 'Auditable Transaction Ledger'
      };
      var targetEl = document.getElementById('feature-name');
      if (targetEl && names[feature]) {
        targetEl.textContent = names[feature];
      }
    })();
  </script>
</body>
</html>
